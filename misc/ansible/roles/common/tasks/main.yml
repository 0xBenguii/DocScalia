- name: Attendre la fin de cloud-init
  command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Neutraliser les timers apt automatiques
  systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  failed_when: false

- name: Attendre la fin des jobs apt transitoires du premier boot
  shell: |
    while systemctl is-active --quiet apt-daily.service \
       || systemctl is-active --quiet apt-daily-upgrade.service; do
      sleep 3
    done
  changed_when: false

- name: Mise a jour du systeme
  apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600
    lock_timeout: 300
  when: system_upgrade

- name: Paquets de securite
  apt:
    name:
      - auditd
      - audispd-plugins
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
      - qemu-guest-agent
      - etckeeper
      - sudo
      - libpam-pwquality
      - console-setup
      - keyboard-configuration
    state: present
    lock_timeout: 300

- name: Clavier console
  template:
    src: keyboard.j2
    dest: /etc/default/keyboard
    mode: "0644"
  notify: setupcon

- name: etckeeper deja initialise
  stat:
    path: /etc/.git
  register: etckeeper_git

- name: Init etckeeper
  command: etckeeper init -d /etc
  when: not etckeeper_git.stat.exists

- name: Identite git pour /etc
  command: "git -C /etc config user.{{ item.key }} '{{ item.value }}'"
  loop:
    - { key: email, value: "{{ etckeeper_email }}" }
    - { key: name, value: "{{ etckeeper_name }}" }
  changed_when: false

- name: Sysctl ANSSI
  template:
    src: 99-anssi-sysctl.conf.j2
    dest: /etc/sysctl.d/99-anssi.conf
    mode: "0644"

- name: Appliquer sysctl
  command: sysctl --system
  changed_when: false

- name: Banniere legale
  copy:
    src: issue.net
    dest: "{{ item }}"
    mode: "0644"
  loop:
    - /etc/issue.net
    - /etc/issue

- name: SSH durci
  template:
    src: 99-anssi-ssh.conf.j2
    dest: /etc/ssh/sshd_config.d/99-anssi.conf
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: reload ssh

- name: Suppression des cles hote faibles
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/ssh_host_dsa_key
    - /etc/ssh/ssh_host_dsa_key.pub
    - /etc/ssh/ssh_host_ecdsa_key
    - /etc/ssh/ssh_host_ecdsa_key.pub
  notify: reload ssh

- name: Politique mots de passe (login.defs)
  lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}"
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - { key: PASS_MAX_DAYS, value: "{{ pass_max_days }}" }
    - { key: PASS_MIN_DAYS, value: "{{ pass_min_days }}" }
    - { key: PASS_WARN_AGE, value: "{{ pass_warn_age }}" }
    - { key: UMASK, value: "027" }
    - { key: ENCRYPT_METHOD, value: "YESCRYPT" }

- name: Dossier pwquality.conf.d
  file:
    path: /etc/security/pwquality.conf.d
    state: directory
    mode: "0755"

- name: Complexite mots de passe (pwquality)
  template:
    src: 99-anssi-pwquality.conf.j2
    dest: /etc/security/pwquality.conf.d/99-anssi.conf
    mode: "0644"

- name: Jail fail2ban
  template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
  notify: restart fail2ban

- name: fail2ban actif
  systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Mises a jour automatiques
  copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: unattended-upgrades actif
  systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Regles auditd
  copy:
    src: 99-anssi.rules
    dest: /etc/audit/rules.d/99-anssi.rules
    mode: "0640"
  notify: load auditd rules

- name: auditd actif
  systemd:
    name: auditd
    enabled: true
    state: started

- name: Desactivation des services inutiles
  systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ disabled_services }}"
  failed_when: false

- name: Blacklist modules noyau
  copy:
    src: 99-anssi-blacklist.conf
    dest: /etc/modprobe.d/99-anssi-blacklist.conf
    mode: "0644"

- name: Dossier journald.conf.d
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Journald persistant
  copy:
    src: 99-persistent.conf
    dest: /etc/systemd/journald.conf.d/99-persistent.conf
    mode: "0644"
  notify: restart journald

- name: Permissions sensibles
  file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/passwd, mode: "0644" }
    - { path: /etc/group, mode: "0644" }
    - { path: /etc/shadow, mode: "0640" }
    - { path: /etc/gshadow, mode: "0640" }
    - { path: /root, mode: "0700" }
  failed_when: false

- name: Permissions grub.cfg
  file:
    path: /boot/grub/grub.cfg
    mode: "0600"
  failed_when: false

- name: Commit etckeeper
  command: 'etckeeper commit "HARDENING ANSSI-BP-028 via Ansible"'
  changed_when: false
  failed_when: false
