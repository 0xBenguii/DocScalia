- name: Nginx
  apt:
    name: nginx
    state: present
    lock_timeout: 300

# en-tete pour identifier quel backend a repondu, sans toucher la page d'accueil
- name: En-tete d'identification du backend
  copy:
    content: "add_header X-Backend $hostname always;\n"
    dest: /etc/nginx/conf.d/00-backend-id.conf
    mode: "0644"
  notify: reload nginx

- name: Nginx actif
  systemd:
    name: nginx
    enabled: true
    state: started
